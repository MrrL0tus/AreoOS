services:
  postgres:
    image: postgres:16-alpine
    container_name: aeroos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aeroos
      POSTGRES_PASSWORD: aeroos_dev_password
      POSTGRES_DB: aeroos
    ports:
      - "5432:5432"
    volumes:
      - aeroos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeroos -d aeroos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aeroos_pgdata:
